<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — EdgeLab</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0d1117;--surface:#161b22;--border:#30363d;
      --text:#e6edf3;--muted:#8b949e;--accent:#4FC3F7;
      --fail-bg:#2e1a1a;--fail-fg:#f85149;
      --warn-bg:#2e2200;--warn-fg:#f0b429}
    body{background:var(--bg);color:var(--text);font-family:-apple-system,
      BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;
      min-height:100vh;display:flex;align-items:center;justify-content:center}
    .card{background:var(--surface);border:1px solid var(--border);
      border-radius:12px;padding:40px;width:100%;max-width:380px}
    .logo{font-size:24px;font-weight:800;color:var(--accent);
      text-align:center;margin-bottom:8px;letter-spacing:-0.5px}
    .logo-sub{text-align:center;color:var(--muted);font-size:13px;
      margin-bottom:32px}
    label{display:block;font-size:12px;color:var(--muted);font-weight:600;
      text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
    input{display:block;width:100%;background:#0d1117;border:1px solid var(--border);
      color:var(--text);padding:10px 14px;border-radius:6px;font-size:14px;
      outline:none;margin-bottom:16px;font-family:inherit}
    input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,195,247,.12)}
    button{display:block;width:100%;background:var(--accent);color:#0d1117;
      border:none;padding:11px;border-radius:6px;font-size:14px;font-weight:700;
      cursor:pointer;margin-top:4px;transition:opacity .15s}
    button:hover{opacity:.85}
    .alert{padding:10px 14px;border-radius:6px;font-size:13px;margin-bottom:16px}
    .alert-fail{background:var(--fail-bg);color:var(--fail-fg);
      border:1px solid rgba(248,81,73,.3)}
    .alert-warn{background:var(--warn-bg);color:var(--warn-fg);
      border:1px solid rgba(240,180,41,.3);font-size:12px}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">EdgeLab</div>
    <div class="logo-sub">Research Engine Control Panel</div>

    {% if warning %}
    <div class="alert alert-warn">
      ⚠ No password configured. Default credentials are
      <strong>admin / admin</strong>.
      Set <code>EDGELAB_PASSWORD_HASH</code> to secure this instance.
    </div>
    {% endif %}

    {% if error %}
    <div class="alert alert-fail">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">
      <input type="hidden" name="next" value="{{ next or '/' }}">

      <label for="username">Username</label>
      <input id="username" name="username" type="text"
             value="{{ username or '' }}" autocomplete="username"
             autofocus required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password"
             autocomplete="current-password" required>

      <button type="submit">Sign In</button>
    </form>
  </div>
</body>
</html>
