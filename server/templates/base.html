<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}EdgeLab{% endblock %} — EdgeLab</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0d1117;--surface:#161b22;--surface2:#1c2230;
      --border:#30363d;--text:#e6edf3;--muted:#8b949e;
      --accent:#4FC3F7;--accent2:#79c0ff;
      --pass-bg:#1a2e1a;--pass-fg:#3fb950;
      --warn-bg:#2e2200;--warn-fg:#f0b429;
      --fail-bg:#2e1a1a;--fail-fg:#f85149;
      --font-mono:'Courier New',Courier,monospace;
    }
    body{background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      font-size:14px;line-height:1.6;display:flex;min-height:100vh}

    /* Sidebar nav */
    nav{width:200px;flex-shrink:0;background:var(--surface);
      border-right:1px solid var(--border);padding:0;position:sticky;
      top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
    .nav-logo{padding:20px;font-size:18px;font-weight:800;color:var(--accent);
      border-bottom:1px solid var(--border);letter-spacing:-0.5px}
    .nav-logo span{color:var(--muted);font-weight:400;font-size:11px;
      display:block;margin-top:2px;letter-spacing:0}
    nav a{display:flex;align-items:center;gap:8px;padding:9px 20px;
      color:var(--muted);text-decoration:none;font-size:13px;
      border-left:3px solid transparent;transition:all .15s}
    nav a:hover{color:var(--text);background:rgba(255,255,255,.04);
      border-left-color:var(--border)}
    nav a.active{color:var(--text);background:rgba(79,195,247,.08);
      border-left-color:var(--accent)}
    .nav-icon{width:16px;text-align:center;font-size:13px}
    .nav-section{padding:12px 20px 4px;font-size:10px;color:var(--border);
      text-transform:uppercase;letter-spacing:.08em}
    .nav-bottom{margin-top:auto;border-top:1px solid var(--border);padding:12px 0}

    /* Notification dot */
    .notif-dot{width:6px;height:6px;border-radius:50%;background:var(--fail-fg);
      margin-left:auto;flex-shrink:0}

    /* Main content */
    main{flex:1;padding:32px 40px;min-width:0;max-width:1280px}
    h1{font-size:20px;font-weight:700;margin-bottom:6px}
    .page-sub{color:var(--muted);font-size:13px;margin-bottom:28px}
    h2{font-size:12px;font-weight:600;text-transform:uppercase;
      letter-spacing:.06em;color:var(--muted);
      border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:16px;
      margin-top:32px}
    h2:first-child{margin-top:0}

    /* Tiles / stat grid */
    .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
      gap:16px;margin-bottom:32px}
    .tile{background:var(--surface);border:1px solid var(--border);
      border-radius:8px;padding:18px 16px}
    .tile-val{font-size:28px;font-weight:700;color:var(--accent);
      font-variant-numeric:tabular-nums;line-height:1}
    .tile-label{font-size:11px;color:var(--muted);text-transform:uppercase;
      letter-spacing:.05em;margin-top:6px}
    .tile-sub{font-size:11px;color:var(--border);margin-top:2px}

    /* Tables */
    .table-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:13px;
      font-variant-numeric:tabular-nums}
    th{background:var(--surface);color:var(--muted);text-align:left;
      padding:8px 12px;border-bottom:1px solid var(--border);
      font-size:11px;text-transform:uppercase;letter-spacing:.04em;
      white-space:nowrap;font-weight:600}
    td{padding:8px 12px;border-bottom:1px solid var(--border);
      vertical-align:middle}
    tr:hover td{background:rgba(255,255,255,.025)}
    td.r,th.r{text-align:right}
    td.mono{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
    .empty{color:var(--muted);font-style:italic;padding:24px 0;text-align:center}

    /* Badges */
    .badge{display:inline-block;padding:2px 8px;border-radius:4px;
      font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
    .badge-pass{background:var(--pass-bg);color:var(--pass-fg)}
    .badge-warn{background:var(--warn-bg);color:var(--warn-fg)}
    .badge-fail{background:var(--fail-bg);color:var(--fail-fg)}
    .badge-blue{background:#162240;color:var(--accent2)}
    .badge-muted{background:var(--surface2);color:var(--muted)}

    /* Buttons */
    .btn{display:inline-block;padding:7px 16px;border-radius:6px;font-size:13px;
      font-weight:600;text-decoration:none;border:none;cursor:pointer;
      transition:opacity .15s}
    .btn:hover{opacity:.85}
    .btn-primary{background:var(--accent);color:#0d1117}
    .btn-secondary{background:var(--surface2);color:var(--text);
      border:1px solid var(--border)}
    .btn-danger{background:var(--fail-bg);color:var(--fail-fg);
      border:1px solid var(--fail-fg)}
    .btn-sm{padding:4px 10px;font-size:12px}

    /* Forms */
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
    .form-grid.cols3{grid-template-columns:1fr 1fr 1fr}
    .form-group{display:flex;flex-direction:column;gap:6px}
    .form-group label{font-size:12px;color:var(--muted);font-weight:600;
      text-transform:uppercase;letter-spacing:.04em}
    .form-group input,.form-group select,.form-group textarea{
      background:var(--surface2);border:1px solid var(--border);
      color:var(--text);padding:8px 12px;border-radius:6px;
      font-size:13px;outline:none;font-family:inherit}
    .form-group input:focus,.form-group select:focus{
      border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,195,247,.12)}
    .form-group .hint{font-size:11px;color:var(--muted)}
    .form-section{background:var(--surface);border:1px solid var(--border);
      border-radius:8px;padding:20px;margin-bottom:20px}
    .form-section-title{font-size:13px;font-weight:700;margin-bottom:16px;
      color:var(--text)}
    .checkbox-row{display:flex;align-items:center;gap:10px}
    .checkbox-row input[type=checkbox]{width:16px;height:16px;
      accent-color:var(--accent);cursor:pointer}
    .checkbox-row label{font-size:13px;color:var(--text);cursor:pointer;
      font-weight:500}
    .full-width{grid-column:1/-1}

    /* Progress bar */
    .progress-bar-wrap{background:var(--surface2);border-radius:4px;
      height:8px;overflow:hidden;margin:8px 0}
    .progress-bar{height:100%;background:var(--accent);border-radius:4px;
      transition:width .3s ease}

    /* Code / log */
    pre,code{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
    .log-box{background:var(--surface);border:1px solid var(--border);
      border-radius:6px;padding:16px;max-height:400px;overflow-y:auto;
      font-family:var(--font-mono);font-size:12px;line-height:1.7}
    .log-line-ok{color:#3fb950}
    .log-line-warn{color:#f0b429}
    .log-line-error{color:#f85149}
    .log-line-step{color:var(--accent);font-weight:600}
    .log-line-info{color:var(--muted)}

    /* Alerts */
    .alert{padding:12px 16px;border-radius:6px;font-size:13px;margin-bottom:16px}
    .alert-warn{background:var(--warn-bg);color:var(--warn-fg);
      border:1px solid var(--warn-fg)}
    .alert-fail{background:var(--fail-bg);color:var(--fail-fg);
      border:1px solid var(--fail-fg)}
    .alert-pass{background:var(--pass-bg);color:var(--pass-fg);
      border:1px solid var(--pass-fg)}

    /* Responsive */
    @media(max-width:768px){
      nav{display:none}
      main{padding:20px}
      .form-grid,.form-grid.cols3{grid-template-columns:1fr}
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <nav>
    <div class="nav-logo">
      EdgeLab
      <span>Research Engine</span>
    </div>

    <div class="nav-section">Research</div>
    <a href="/"         class="{% if request.url.path == '/' %}active{% endif %}">
      <span class="nav-icon">◈</span> Dashboard
    </a>
    <a href="/research" class="{% if request.url.path == '/research' %}active{% endif %}">
      <span class="nav-icon">▶</span> New Run
    </a>
    <a href="/jobs"     class="{% if '/jobs' in request.url.path %}active{% endif %}">
      <span class="nav-icon">⚙</span> Running Jobs
      {% if notifications|length > 0 %}<span class="notif-dot"></span>{% endif %}
    </a>

    <div class="nav-section">Results</div>
    <a href="/reports"    class="{% if request.url.path == '/reports' %}active{% endif %}">
      <span class="nav-icon">📄</span> Reports
    </a>
    <a href="/history"    class="{% if request.url.path == '/history' %}active{% endif %}">
      <span class="nav-icon">🕐</span> History
    </a>
    <a href="/strategies" class="{% if request.url.path == '/strategies' %}active{% endif %}">
      <span class="nav-icon">📊</span> Strategies
    </a>

    <div class="nav-section">Trading</div>
    <a href="/bot" class="{% if request.url.path == '/bot' %}active{% endif %}">
      <span class="nav-icon">🤖</span> Paper Bot
    </a>

    <div class="nav-section">Automation</div>
    <a href="/scheduler"  class="{% if request.url.path == '/scheduler' %}active{% endif %}">
      <span class="nav-icon">🗓</span> Scheduler
    </a>

    <div class="nav-bottom">
      <a href="/settings" class="{% if request.url.path == '/settings' %}active{% endif %}">
        <span class="nav-icon">⚙</span> Settings
      </a>
      <a href="/logs"     class="{% if request.url.path == '/logs' %}active{% endif %}">
        <span class="nav-icon">📋</span> Logs
      </a>
      <a href="/logout">
        <span class="nav-icon">⇥</span> Sign out
      </a>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

</body>
</html>
